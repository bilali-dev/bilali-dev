[project]
name = "market-seller-api"
version = "0.1.0"
description = "Extract structured product and seller data from marketplace pages."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Header() default-argument pattern is the documented,
# idiomatic way to declare dependencies; it is not the bug this rule targets.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
